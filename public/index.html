<!DOCTYPE html>
<html>
<head>
    <title>GGJ Community Game</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; }
        #wheel { width: 300px; height: 300px; border-radius: 50%; border: 10px solid gold; 
                 transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); margin: 20px auto; 
                 display: flex; align-items: center; justify-content: center; background: conic-gradient(red, blue, green, yellow, purple, orange, cyan, pink); }
        .player-list { list-style: none; padding: 0; }
        .player-item { background: #444; margin: 5px; padding: 10px; border-radius: 5px; }
        #game-ui { display: none; }
    </style>
</head>
<body>
    <h1>GGJ Challenge</h1>

    <div id="setup">
        <input type="text" id="nameInput" placeholder="Enter Name">
        <button onclick="join()">Join Game</button>
    </div>

    <div id="game-ui">
        <button id="admin-btn" style="display:none;" onclick="spin()">ADMIN: SPIN WHEEL</button>
        <div id="wheel">WHEEL</div>
        <h2 id="current-task">Waiting for spin...</h2>
        
        <h3>Leaderboard</h3>
        <ul id="players" class="player-list"></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "";

        function join() {
            myName = document.getElementById('nameInput').value;
            if(!myName) return alert("Enter a name!");
            socket.emit('join-game', myName);
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            // For testing, make the first person the admin
            if (myName.toLowerCase() === 'admin') {
                document.getElementById('admin-btn').style.display = 'inline-block';
            }
        }

        function spin() {
            socket.emit('admin-spin');
        }

        socket.on('update-players', (list) => {
            const ul = document.getElementById('players');
            ul.innerHTML = list.map(p => `<li class="player-item">${p.name}: ${p.score} pts</li>`).join('');
        });

        socket.on('wheel-result', (data) => {
            const wheel = document.getElementById('wheel');
            const randomRotation = Math.floor(Math.random() * 360) + 1440; // 4 full spins + random
            wheel.style.transform = `rotate(${randomRotation}deg)`;
            
            setTimeout(() => {
                document.getElementById('current-task').innerText = "ROUND " + data.round + ": " + data.challenge;
            }, 4000);
        });
    </script>
</body>
</html>
