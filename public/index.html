<!DOCTYPE html>
<html>
<head>
    <title>GGJ Community Game V2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #46178f; color: white; margin: 0; padding: 0;}
        h1 { margin-top: 40px; font-size: 3em; }
        
        #setup { margin-top: 100px; }
        input { padding: 15px; font-size: 1.2em; border-radius: 5px; border: none; width: 250px; text-align: center; }
        button { padding: 15px 30px; font-size: 1.2em; border-radius: 5px; border: none; background: #333333; color: white; cursor: pointer; font-weight: bold; margin-top: 20px;}
        button:hover { background: #222; }
        
        /* Kahoot Style Challenge Display */
        #challenge-display {
            background: white; color: #333; padding: 40px; margin: 40px auto;
            width: 60%; border-radius: 10px; box-shadow: 0px 8px 15px rgba(0,0,0,0.2);
            font-size: 2em; font-weight: bold; display: none;
        }

        .player-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; max-width: 800px; margin: auto;}
        .player-item { background: #260c4f; margin: 5px; padding: 15px; border-radius: 5px; font-weight: bold; min-width: 120px;}
        
        #game-ui { display: none; padding: 20px; }
        #admin-controls { margin: 20px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <h1>GGJ Challenge V2</h1>

    <div id="setup">
        <input type="text" id="nameInput" placeholder="Enter Nickname..."><br>
        <button onclick="join()">Enter</button>
    </div>

    <div id="game-ui">
        
        <div id="admin-controls">
            <h3>Admin Controls</h3>
            <button onclick="nextRound()">START / NEXT ROUND</button>
        </div>

        <h2 id="round-indicator">Waiting for host to start...</h2>
        
        <div id="challenge-display">Get Ready!</div>
        
        <div style="margin-top: 50px;">
            <h3>Scoreboard</h3>
            <ul id="players" class="player-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "";

        function join() {
            myName = document.getElementById('nameInput').value;
            if(!myName) return alert("Please enter a nickname!");
            
            socket.emit('join-game', myName);
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            // For testing: if name is 'admin', show the controls
            if (myName.toLowerCase() === 'admin') {
                document.getElementById('admin-controls').style.display = 'block';
            }
        }

        function nextRound() {
            socket.emit('admin-next-round');
        }

        socket.on('update-players', (list) => {
            // Sort by highest score first
            list.sort((a, b) => b.score - a.score);
            const ul = document.getElementById('players');
            ul.innerHTML = list.map(p => `<li class="player-item">${p.name}<br><span style="color: gold;">${p.score}</span></li>`).join('');
        });

        // Instantly display the next challenge
        socket.on('new-round', (data) => {
            const display = document.getElementById('challenge-display');
            document.getElementById('round-indicator').innerText = `ROUND ${data.round} OF 10`;
            
            // Kahoot-style brief "Get Ready" flash before showing the challenge
            display.style.display = 'block';
            display.style.background = '#f2f2f2';
            display.innerText = "Get Ready...";
            
            setTimeout(() => {
                display.style.background = 'white';
                display.innerText = data.challenge;
                // Here is where you would load the specific JSON data and images for the challenge
            }, 1500); 
        });

        socket.on('game-over', (players) => {
            document.getElementById('round-indicator').innerText = "GAME OVER!";
            document.getElementById('challenge-display').innerText = "Look at the scoreboard to see the winner!";
            document.getElementById('admin-controls').style.display = 'none';
        });
    </script>
</body>
</html>
