<!DOCTYPE html>
<html>
<head>
    <title>Game Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #222; color: white; padding: 20px; }
        h1 { border-bottom: 2px solid #555; padding-bottom: 10px; }
        
        button { background: #00ff00; color: black; font-size: 1.2em; font-weight: bold; padding: 15px 30px; border: none; cursor: pointer; border-radius: 5px; margin-bottom: 20px; box-shadow: 0px 4px 6px rgba(0,0,0,0.5);}
        button:hover { background: #00cc00; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.5); }
        th, td { padding: 12px; text-align: center; border: 1px solid #555; }
        th { background: #333; color: #00ff00; }
        .col-total { font-weight: bold; color: gold; background: rgba(255,215,0,0.1); }
        .col-id { color: #aaa; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Master Admin Panel</h1>
    <button onclick="nextRound()">START / NEXT ROUND</button>
    
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Nickname</th>
                <th>User ID</th>
                <th>R1</th> <th>R2</th> <th>R3</th> <th>R4</th> <th>R5</th>
                <th>R6</th> <th>R7</th> <th>R8</th> <th>R9</th> <th>R10</th>
                <th class="col-total">TOTAL</th>
            </tr>
        </thead>
        <tbody id="admin-table-body">
            </tbody>
    </table>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function nextRound() {
            socket.emit('admin-next-round');
        }

        socket.on('update-admin', (players) => {
            // Sort highest to lowest based on Total Score
            players.sort((a, b) => b.totalScore - a.totalScore);
            
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = players.map((p, index) => {
                // Generate the 10 round columns dynamically
                let roundCells = p.roundScores.map(score => `<td>${score}</td>`).join('');
                
                return `
                    <tr>
                        <td>#${index + 1}</td>
                        <td><strong>${p.name}</strong></td>
                        <td class="col-id">${p.userId}</td>
                        ${roundCells}
                        <td class="col-total">${p.totalScore}</td>
                    </tr>
                `;
            }).join('');
        });
    </script>
</body>
</html>
